<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flexbox — Навигационное меню</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #cfdef3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            border: 3px solid #b873ff;
            background: rgba(200, 160, 255, 0.15);
            padding: 20px;
            border-radius: 42px;
            width: 460px;
            height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .row-center {
            display: flex;
            justify-content: center;
        }

        .row-left {
            display: flex;
            justify-content: flex-start;
        }

        .card {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #7c3aed, #5b21b6);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            text-align: center;
            padding: 6px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #8b5cf6, #6d28d9);
        }

        .card-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .card-text {
            font-size: 0.7rem;
            font-weight: normal;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 20px;
        }
        .card-image {
            background: linear-gradient(145deg, #3b82f6, #1e40af);
        }
        
        .card-image .card-icon {
            font-size: 2rem;
        }

        .bottom-row {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-group">
            <div class="row-center">
                <div class="card">
                    <div class="card-icon">🏠</div>
                    <div class="card-text">Главная</div>
                </div>
            </div>
            <div class="row-left">
                <div class="card">
                    <div class="card-icon">💬</div>
                    <div class="card-text">Чаты</div>
                </div>
            </div>
            <div class="row-left">
                <div class="card">
                    <div class="card-icon">🔔</div>
                    <div class="card-text">Новости</div>
                </div>
            </div>
            <div class="row">
                <div></div> 
                <div class="card">
                    <div class="card-icon">👤</div>
                    <div class="card-text">Профиль</div>
                </div>
            </div>
            <div class="row-left">
                <div class="card">
                    <div class="card-icon">⚙️</div>
                    <div class="card-text">Настройки</div>
                </div>
            </div>
        </div>
        <div class="bottom-row">
            <div class="card card-image">
                <div class="card-icon">📷</div>
                <div class="card-text">Фото</div>
            </div>
        </div>
    </div>
</body>
</html>
