<!DOCTYPE html>
<head>
    <title>Авторизация</title>
</head>
<body>
    <h1>Введите логин</h1>
    <button onclick="askFullName()">Ввести логин</button>
    <script>
    function askFullName(){
       let login = prompt("Введите логин:");
       if (login === null) {
         alert("Вход отменён");
        } else if (login === "Админ") {
            let password = prompt("Введите пароль:");
            if (password === null) {
                alert("Вход отменён");
            } else if (password === "Чёрный Властелин") {
                alert("Добро пожаловать!");
            } else {
                alert("Пароль неверен");
            }
        } else {
            alert("Я вас не знаю");
        }
    }
    </script>
</body>
</html>
