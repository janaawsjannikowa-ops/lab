<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анкета слушателя курсов</title>
<style>
    body { font-family: Arial; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    td, th { border: 1px solid #ccc; padding: 5px; text-align: center; }
    .total { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h3>Анкета слушателя</h3>
<form id="courseForm">
    ФИО: <input type="text" name="fio" required placeholder="Введите ФИО"><br><br>
    E-mail: <input type="email"><br><br>
    Возраст: <input type="number"><br><br>
    Адрес: <input type="text"><br><br>

    <table>
        <tr>
            <th>Курс</th>
            <th>Длительность</th>
            <th>Язык</th>
            <th>Отчетность</th>
            <th>Стоимость</th>
        </tr>

        <tr>
            <td><input type="checkbox" class="course" data-base="10"> Информатика</td>
            <td>
                <input type="radio" name="dur1" value="1">36
                <input type="radio" name="dur1" value="1.5">64
                <input type="radio" name="dur1" value="2">128
            </td>
            <td>
                <select class="lang">
                    <option value="1">Русский</option>
                    <option value="1.2">Английский</option>
                </select>
            </td>
            <td>
                <select class="report">
                    <option value="1">Экзамен</option>
                    <option value="0.8">Зачет</option>
                </select>
            </td>
            <td><input type="text" class="price" readonly></td>
        </tr>

        <tr>
            <td><input type="checkbox" class="course" data-base="8"> Базы данных</td>
            <td>
                <input type="radio" name="dur2" value="1">36
                <input type="radio" name="dur2" value="1.5">64
                <input type="radio" name="dur2" value="2">128
            </td>
            <td>
                <select class="lang">
                    <option value="1">Русский</option>
                    <option value="1.2">Английский</option>
                </select>
            </td>
            <td>
                <select class="report">
                    <option value="1">Экзамен</option>
                    <option value="0.8">Зачет</option>
                </select>
            </td>
            <td><input type="text" class="price" readonly></td>
        </tr>

        <tr>
            <td><input type="checkbox" class="course" data-base="6"> Сети</td>
            <td>
                <input type="radio" name="dur3" value="1">36
                <input type="radio" name="dur3" value="1.5">64
                <input type="radio" name="dur3" value="2">128
            </td>
            <td>
                <select class="lang">
                    <option value="1">Русский</option>
                    <option value="1.2">Английский</option>
                </select>
            </td>
            <td>
                <select class="report">
                    <option value="1">Экзамен</option>
                    <option value="0.8">Зачет</option>
                </select>
            </td>
            <td><input type="text" class="price" readonly></td>
        </tr>

        <tr>
            <td><input type="checkbox" class="course" data-base="5"> Логика</td>
            <td>
                <input type="radio" name="dur4" value="1">36
                <input type="radio" name="dur4" value="1.5">64
                <input type="radio" name="dur4" value="2">128
            </td>
            <td>
                <select class="lang">
                    <option value="1">Русский</option>
                    <option value="1.2">Английский</option>
                </select>
            </td>
            <td>
                <select class="report">
                    <option value="1">Экзамен</option>
                    <option value="0.8">Зачет</option>
                </select>
            </td>
            <td><input type="text" class="price" readonly></td>
        </tr>
    </table>

    <div class="total">
        Общая стоимость:
        <input type="text" id="total" readonly> у.е.
    </div><br>

    <button type="submit">Вычислить</button>
    <button type="reset">Отменить</button>
    <input type = "submit" value = "Отправить">
</form>

<script>
document.getElementById("courseForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let total = 0;
    let rows = document.querySelectorAll("table tr");

    rows.forEach((row, index) => {
        if (index === 0) return;

        let checkbox = row.querySelector(".course");
        let priceField = row.querySelector(".price");

        if (checkbox.checked) {
            let base = parseFloat(checkbox.dataset.base);

            let duration = row.querySelector("input[type=radio]:checked");
            let lang = row.querySelector(".lang").value;
            let report = row.querySelector(".report").value;

            if (duration) {
                let cost = base * duration.value * lang * report;
                priceField.value = cost.toFixed(2);
                total += cost;
            } else {
                priceField.value = "";
            }
        } else {
            priceField.value = "";
        }
    });

    document.getElementById("total").value = total.toFixed(2);
});
</script>

</body>
</html>
